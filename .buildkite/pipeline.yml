{
  "steps": [
    {
      "label": "R3 checkpoint storage validation: DeepEP + FP8 (not final PR candidate)",
      "command": "PR=\"${BUILDKITE_PULL_REQUEST:-false}\"\n[ \"$PR\" = \"false\" ] && PR=\"non-pr\"\nexport GITHUB_COMMIT_NAME=\"${BUILDKITE_COMMIT}_${PR}\"\nulimit -n \"$(ulimit -Hn)\"\necho \"RLIMIT_NOFILE=$(ulimit -Sn)/$(ulimit -Hn)\"\npip install -e . --no-deps --break-system-packages\npython tests/ci/gpu_lock_exec.py --count 8 -- python tests/test_qwen3_30B_A3B_r3.py",
      "agents": {
        "queue": "mithril-h100-pool"
      },
      "timeout_in_minutes": 360,
      "retry": {
        "automatic": [
          {
            "exit_status": -1,
            "limit": 2
          },
          {
            "exit_status": 1,
            "limit": 2
          }
        ]
      },
      "plugins": [
        {
          "kubernetes": {
            "podSpec": {
              "containers": [
                {
                  "image": "vllm/vime@sha256:316f66e4aed0c71fcd4c710083d8808d946cced22393289406e76ba184b9b82d",
                  "resources": {
                    "limits": {
                      "nvidia.com/gpu": 8
                    }
                  },
                  "volumeMounts": [
                    {
                      "name": "devshm",
                      "mountPath": "/dev/shm"
                    },
                    {
                      "name": "hf-cache",
                      "mountPath": "/root/.cache/huggingface"
                    }
                  ],
                  "env": [
                    {
                      "name": "HF_HOME",
                      "value": "/root/.cache/huggingface"
                    },
                    {
                      "name": "VIME_TEST_ENABLE_INFINITE_RUN",
                      "value": "false"
                    },
                    {
                      "name": "VIME_TEST_USE_DEEPEP",
                      "value": "1"
                    },
                    {
                      "name": "VIME_TEST_USE_FP8_ROLLOUT",
                      "value": "1"
                    },
                    {
                      "name": "VIME_TEST_ENABLE_EVAL",
                      "value": "0"
                    },
                    {
                      "name": "NCCL_NVLS_ENABLE",
                      "value": "0"
                    }
                  ]
                }
              ],
              "nodeSelector": {
                "node.kubernetes.io/instance-type": "gpu-h100-sxm"
              },
              "volumes": [
                {
                  "name": "devshm",
                  "emptyDir": {
                    "medium": "Memory"
                  }
                },
                {
                  "name": "hf-cache",
                  "hostPath": {
                    "path": "/mnt/hf-cache",
                    "type": "DirectoryOrCreate"
                  }
                }
              ]
            }
          }
        }
      ]
    }
  ]
}

